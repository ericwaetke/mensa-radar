name: pipeline
on:
  workflow_dispatch:
  push:
    branches:
      - "main"

# The image is built entirely on the GitHub runner - the server only pulls it.
permissions:
  contents: read
  packages: write

jobs:
  # run-tests:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: oven-sh/setup-bun@v2
  #     - name: Install dependencies
  #       run: bun install
  #     - name: Lint with the bun CLI
  #       run: bun run lint

  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ericwaetke/mensaradar:latest
            ghcr.io/ericwaetke/mensaradar:${{ github.sha }}
          # Layer cache in GitHub Actions so only changed steps rebuild
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only runs if the Dokploy secrets are configured; the Dokploy app must
      # be a "Docker" application pulling ghcr.io/ericwaetke/mensaradar:latest,
      # so a deploy is a pull and never a build on the server.
      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_AUTH_TOKEN: ${{ secrets.DOKPLOY_AUTH_TOKEN }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_AUTH_TOKEN" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "Dokploy secrets not configured, skipping deploy trigger"
            exit 0
          fi
          curl -fsS -X POST "$DOKPLOY_URL/api/trpc/application.deploy" \
            -H 'accept: application/json' \
            -H "x-api-key: $DOKPLOY_AUTH_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"json\":{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}}"
